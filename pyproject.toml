[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-failure"
version = "1.1.0"
description = "Reproducible synthetic Alberta oil and gas maintenance-policy benchmark"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.3.2,<2.4", "pandas==2.3.3", "scikit-learn==1.7.2",
  "matplotlib==3.10.7", "joblib==1.5.2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5", "Pillow>=11,<13", "PyYAML>=6,<7"]
notebook = ["jupyterlab>=4,<5", "nbclient>=0.10,<1"]

[project.scripts]
energy-pipeline = "energy_failure.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
